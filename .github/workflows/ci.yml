name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sibling repos (../agora, ../l4-kernel, ../bus-foundation)
        # metaos pyproject 用 [tool.uv.sources] path 依赖兄弟仓库 (agora/bus-foundation 为 private,
        # 需 OMOSTATION_BOT_TOKEN), clone 到  上级目录
        env:
          BOT_TOKEN: ${{ secrets.OMOSTATION_BOT_TOKEN }}
        run: |
          for repo in agora l4-kernel bus-foundation ecos; do
            if [ -n "$BOT_TOKEN" ]; then
              git clone --depth 1 "https://${BOT_TOKEN}@github.com/starlink-awaken/omostation-$repo" ../$repo
            else
              git clone --depth 1 "https://github.com/starlink-awaken/omostation-$repo" ../$repo
            fi
          done
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync
      - name: Ruff check
        run: uv run ruff check src/
      - name: Ruff format check
        run: uv run ruff format src/ --check
      - name: Contract Gatekeeper
        run: python scripts/contract_gatekeeper.py src/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sibling repos (../agora, ../l4-kernel, ../bus-foundation)
        # metaos pyproject 用 [tool.uv.sources] path 依赖兄弟仓库 (agora/bus-foundation 为 private,
        # 需 OMOSTATION_BOT_TOKEN), clone 到  上级目录
        env:
          BOT_TOKEN: ${{ secrets.OMOSTATION_BOT_TOKEN }}
        run: |
          for repo in agora l4-kernel bus-foundation ecos; do
            if [ -n "$BOT_TOKEN" ]; then
              git clone --depth 1 "https://${BOT_TOKEN}@github.com/starlink-awaken/omostation-$repo" ../$repo
            else
              git clone --depth 1 "https://github.com/starlink-awaken/omostation-$repo" ../$repo
            fi
          done
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync
      - name: Run tests
        run: uv run pytest tests/ -q --tb=short
